<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录索引 · leona05.github.io</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1c2940;
      --ink-soft: #344259;
      --muted: #7f8b9f;
      --muted-light: #9ba6b7;
      --line: #dfe7f0;
      --line-soft: #eaf0f6;
      --page: #f4f8fc;
      --card: #ffffff;
      --blue: #2382e7;
      --blue-deep: #176fd3;
      --cyan: #18a9c8;
      --amber: #f49a22;
      --violet: #7a5cf0;
      --green: #18a76e;
      --danger: #e64a5d;
    }
    html, body { margin: 0; }
    body {
      min-height: 100%;
      color: var(--ink);
      background:
        linear-gradient(rgba(35,130,231,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35,130,231,.022) 1px, transparent 1px),
        var(--page);
      background-size: 36px 36px;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    /* ---------- 顶栏 ---------- */
    .topbar {
      min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 14px 34px; color: #fff;
      background: linear-gradient(110deg, #176fd3 0%, #238be5 52%, #18a9c8 100%);
      box-shadow: 0 5px 22px rgba(34,125,205,.18);
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.4); border-radius: 7px; background: rgba(255,255,255,.13);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand h1 { margin: 0; font-size: 19px; line-height: 23px; }
    .brand p { margin: 3px 0 0; font-size: 10px; letter-spacing: .12em; opacity: .76; }
    .controls { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
    .control-button {
      height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px;
      border: 1px solid rgba(255,255,255,.36); border-radius: 6px; color: #fff;
      background: rgba(255,255,255,.11); font-size: 11px; transition: background .18s ease;
    }
    .control-button:hover { background: rgba(255,255,255,.2); }
    .control-button svg { width: 14px; height: 14px; }
    .control-button[disabled] { opacity: .55; cursor: default; }

    /* ---------- 主体 ---------- */
    main { max-width: 1080px; margin: 0 auto; padding: 26px 30px 46px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .title { display: flex; align-items: center; gap: 10px; }
    .title::before { content: ""; width: 4px; height: 23px; border-radius: 3px; background: linear-gradient(var(--blue), var(--cyan)); }
    .title h2 { margin: 0; font-size: 18px; }
    .page-head p { margin: 6px 0 0 14px; color: var(--muted-light); font-size: 11px; }
    .status { display: flex; align-items: center; gap: 7px; padding-top: 7px; color: var(--muted); font-size: 10px; }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(24,167,110,.1); }
    .status.is-loading i { background: var(--amber); box-shadow: 0 0 0 4px rgba(244,154,34,.12); }
    .status.is-error i { background: var(--danger); box-shadow: 0 0 0 4px rgba(230,74,93,.12); }

    /* ---------- 面包屑 ---------- */
    .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px 14px; font-size: 12px; color: var(--muted); }
    .crumb { padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; transition: border-color .18s ease, color .18s ease; }
    .crumb:hover { border-color: rgba(35,130,231,.45); color: var(--blue-deep); }
    .crumb.is-current { color: var(--ink-soft); font-weight: 600; border-color: rgba(35,130,231,.3); background: #f1f7fe; cursor: default; }
    .crumb-sep { color: #c3cedb; }

    /* ---------- 列表 ---------- */
    .panel {
      border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.82);
      box-shadow: 0 12px 30px rgba(28,41,64,.05); overflow: hidden;
    }
    .panel-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 16px; border-bottom: 1px solid var(--line-soft); background: #fbfdff;
      color: var(--muted); font-size: 11px;
    }
    .panel-bar b { color: var(--ink-soft); font-weight: 600; }
    .list { list-style: none; margin: 0; padding: 0; }
    .row {
      display: flex; align-items: center; gap: 13px; padding: 11px 16px;
      border-bottom: 1px solid var(--line-soft); transition: background .16s ease;
    }
    .list .row:last-child { border-bottom: 0; }
    .row:hover { background: #f6fafe; }
    .row-icon {
      width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted);
    }
    .row-icon svg { width: 17px; height: 17px; }
    .row-icon.is-dir { color: var(--blue); border-color: rgba(35,130,231,.24); background: #f2f8ff; }
    .row-icon.is-html { color: var(--blue-deep); border-color: rgba(35,130,231,.2); background: #f5faff; }
    .row-icon.is-img { color: var(--violet); border-color: rgba(122,92,240,.22); background: #f7f5ff; }
    .row-icon.is-doc { color: var(--green); border-color: rgba(24,167,110,.22); background: #f2fbf7; }
    .row-icon.is-code { color: var(--amber); border-color: rgba(244,154,34,.24); background: #fffaf2; }
    .row-icon.is-hidden { color: var(--muted-light); border-style: dashed; }
    .row-body { flex: 1; min-width: 0; }
    .row-name { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); line-height: 20px; }
    .row:hover .row-name { color: var(--blue-deep); }
    .row-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { margin: 3px 0 0; display: flex; align-items: center; gap: 10px; color: var(--muted-light); font-size: 10.5px; }
    .row-meta code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
    .tag { padding: 1px 6px; border-radius: 4px; background: #eef4fb; color: #6b7c93; font-size: 9.5px; }
    .tag.is-dir { background: #eaf4ff; color: var(--blue-deep); }
    .row-go { flex: 0 0 auto; color: #c3cedb; display: grid; place-items: center; }
    .row-go svg { width: 15px; height: 15px; }
    .row:hover .row-go { color: var(--blue); }

    /* ---------- 状态块 ---------- */
    .state { padding: 46px 20px; text-align: center; color: var(--muted); font-size: 12px; }
    .state svg { width: 30px; height: 30px; margin-bottom: 10px; color: #c3cedb; }
    .state b { display: block; margin-bottom: 5px; color: var(--ink-soft); font-size: 13px; }
    .state a { color: var(--blue-deep); text-decoration: underline; text-underline-offset: 2px; }
    .skeleton { padding: 4px 0; }
    .skeleton .sk-row { display: flex; align-items: center; gap: 13px; padding: 11px 16px; animation: pulse 1.5s ease-in-out infinite; }
    .skeleton .sk-box { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 8px; background: #eef3f9; }
    .skeleton .sk-lines { flex: 1; }
    .skeleton .sk-l1 { height: 10px; width: 42%; border-radius: 4px; background: #eef3f9; }
    .skeleton .sk-l2 { height: 8px; width: 22%; margin-top: 8px; border-radius: 4px; background: #f2f6fa; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

    .foot { margin: 16px 2px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted-light); font-size: 10.5px; }
    .foot a { color: var(--muted); border-bottom: 1px dashed #cdd8e4; }
    .foot a:hover { color: var(--blue-deep); border-color: rgba(35,130,231,.5); }

    @media (max-width: 720px) {
      .topbar { padding: 12px 18px; }
      main { padding: 20px 16px 36px; }
      .brand h1 { font-size: 16px; }
      .page-head p, .crumbs { margin-left: 0; }
      .row { padding: 11px 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <div>
        <h1>目录索引</h1>
        <p>leona05.github.io</p>
      </div>
    </div>
    <div class="controls">
      <button class="control-button" id="refreshButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span>刷新</span>
      </button>
      <a class="control-button" id="repoButton" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        <span>仓库</span>
      </a>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <div class="title"><h2>当前目录</h2></div>
        <p>点击文件夹进入下一级，点击文件直接打开</p>
      </div>
      <div class="status" id="statusBar"><i></i><span id="statusText">正在读取目录…</span></div>
    </div>

    <nav class="crumbs" id="crumbs" aria-label="路径"></nav>

    <section class="panel">
      <div class="panel-bar">
        <span id="panelPath">/</span>
        <span id="panelCount">—</span>
      </div>
      <ul class="list" id="list"></ul>
      <div class="skeleton" id="skeleton">
        <div class="sk-row"><div class="sk-box"></div><div class="sk-lines"><div class="sk-l1"></div><div class="sk-l2"></div></div></div>
        <div class="sk-row"><div class="sk-box"></div><div class="sk-lines"><div class="sk-l1" style="width:34%"></div><div class="sk-l2" style="width:18%"></div></div></div>
        <div class="sk-row"><div class="sk-box"></div><div class="sk-lines"><div class="sk-l1" style="width:48%"></div><div class="sk-l2" style="width:26%"></div></div></div>
        <div class="sk-row"><div class="sk-box"></div><div class="sk-lines"><div class="sk-l1" style="width:38%"></div><div class="sk-l2" style="width:20%"></div></div></div>
      </div>
      <div class="state" id="state" hidden></div>
    </section>

    <div class="foot">
      <span id="sourceNote">数据来源：GitHub Contents API</span>
      <a href="https://github.com/Leona05/leona05.github.io" target="_blank" rel="noopener">在 GitHub 上查看仓库</a>
    </div>
  </main>

  <script>
    /* ================= 配置 ================= */
    var OWNER = 'Leona05';
    var REPO  = 'leona05.github.io';
    var API   = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/';
    var REPO_URL = 'https://github.com/' + OWNER + '/' + REPO;

    /* API 不可用时的兜底清单（仅根目录，下次推送后请同步更新） */
    var FALLBACK = [
      { name: 'review-graphic', type: 'dir'  },
      { name: 'showcase',       type: 'dir'  },
      { name: '监测云助手',      type: 'dir'  },
      { name: '机构平台',        type: 'dir'  },
      { name: '.gitignore',     type: 'file' },
      { name: 'index.html',     type: 'file' }
    ];

    /* ================= 图标 ================= */
    var ICONS = {
      dir:  '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
      code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
      img:  '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.35-4.35a2 2 0 0 0-2.83 0L4 20"/>',
      doc:  '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/>',
      hide: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/>',
      arrow:'<path d="m9 18 6-6-6-6"/>',
      empty:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h6"/>'
    };
    function svg(path, extra) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
             'stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '>' + path + '</svg>';
    }

    /* ================= 工具 ================= */
    function classify(item) {
      var n = item.name;
      if (item.type === 'dir') return 'dir';
      if (n.charAt(0) === '.') return 'hide';
      var ext = (n.split('.').pop() || '').toLowerCase();
      if (ext === 'html' || ext === 'htm') return 'code';
      if (['png','jpg','jpeg','gif','svg','webp','avif','ico'].indexOf(ext) > -1) return 'img';
      if (['md','txt','pdf','doc','docx','xls','xlsx','csv'].indexOf(ext) > -1) return 'doc';
      if (['js','css','json','yml','yaml','ts','py'].indexOf(ext) > -1) return 'code';
      return 'file';
    }
    var KIND_TEXT = { dir: '文件夹', file: '文件', code: '网页 / 代码', img: '图片', doc: '文档', hide: '隐藏文件' };
    var ICON_KEY  = { dir: 'dir', file: 'file', code: 'code', img: 'img', doc: 'doc', hide: 'hide' };

    function formatSize(bytes) {
      if (typeof bytes !== 'number') return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }
    function encodePath(p) {
      return p.split('/').map(encodeURIComponent).join('/');
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    /* 目录 → 页内逐级进入（hash 路由，避免目录无 index.html 时 404）
       隐藏文件 → GitHub blob（Pages 不发布点文件）；其余文件 → 站点直链 */
    function itemHref(item) {
      var path = encodePath(item.path);
      if (item.type === 'dir') return '#/' + path;
      if (item.name.charAt(0) === '.') return REPO_URL + '/blob/main/' + path;
      return '/' + path;
    }

    /* ================= 状态 ================= */
    var listEl     = document.getElementById('list');
    var stateEl    = document.getElementById('state');
    var skeletonEl = document.getElementById('skeleton');
    var crumbsEl   = document.getElementById('crumbs');
    var statusBar  = document.getElementById('statusBar');
    var statusText = document.getElementById('statusText');
    var panelPath  = document.getElementById('panelPath');
    var panelCount = document.getElementById('panelCount');
    var sourceNote = document.getElementById('sourceNote');
    document.getElementById('repoButton').href = REPO_URL;

    function setStatus(kind, text) {
      statusBar.className = 'status' + (kind ? ' is-' + kind : '');
      statusText.textContent = text;
    }
    function showState(html) {
      stateEl.innerHTML = html;
      stateEl.hidden = false;
      skeletonEl.hidden = true;
      listEl.hidden = true;
    }

    /* ================= 渲染 ================= */
    function renderCrumbs(dir) {
      var html = '<a class="crumb' + (dir ? '' : ' is-current') + '" href="#" data-dir="">根目录</a>';
      if (dir) {
        var segs = dir.split('/');
        var acc = [];
        segs.forEach(function (seg, idx) {
          acc.push(seg);
          var isLast = idx === segs.length - 1;
          html += '<span class="crumb-sep">/</span>' +
                  '<a class="crumb' + (isLast ? ' is-current' : '') + '" href="#" data-dir="' + esc(acc.join('/')) + '">' + esc(seg) + '</a>';
        });
      }
      crumbsEl.innerHTML = html;
    }

    function renderList(items, dir) {
      var dirs  = items.filter(function (i) { return i.type === 'dir'; });
      var files = items.filter(function (i) { return i.type !== 'dir'; });
      var cmp = function (a, b) { return a.name.localeCompare(b.name, 'zh-Hans-CN'); };
      dirs.sort(cmp); files.sort(cmp);
      var ordered = dirs.concat(files);

      panelPath.textContent = '/' + (dir ? dir + '/' : '');
      panelCount.textContent = dirs.length + ' 个文件夹 · ' + files.length + ' 个文件';

      if (!ordered.length) {
        showState(svg(ICONS.empty) + '<b>此目录为空</b>没有可显示的文件或文件夹');
        return;
      }

      listEl.innerHTML = ordered.map(function (item) {
        var kind = classify(item);
        var meta = '<span class="tag' + (item.type === 'dir' ? ' is-dir' : '') + '">' + KIND_TEXT[kind] + '</span>';
        if (item.type === 'file' && typeof item.size === 'number') meta += '<span>' + formatSize(item.size) + '</span>';
        return '<li><a class="row" href="' + esc(itemHref(item)) + '"' +
               (item.type === 'dir' ? '' : ' target="_blank" rel="noopener"') + '>' +
                 '<span class="row-icon is-' + kind + '">' + svg(ICONS[ICON_KEY[kind]]) + '</span>' +
                 '<span class="row-body">' +
                   '<span class="row-name"><span>' + esc(item.name) + '</span></span>' +
                   '<span class="row-meta">' + meta + '</span>' +
                 '</span>' +
                 '<span class="row-go">' + svg(ICONS.arrow) + '</span>' +
               '</a></li>';
      }).join('');

      listEl.hidden = false;
      stateEl.hidden = true;
      skeletonEl.hidden = true;
    }

    /* ================= 数据 ================= */
    var currentDir = '';

    function load(dir) {
      currentDir = dir;
      window.location.hash = dir ? '#/' + dir : '';
      renderCrumbs(dir);
      setStatus('loading', '正在读取目录…');
      skeletonEl.hidden = false;
      listEl.hidden = true;
      stateEl.hidden = true;

      fetch(API + encodePath(dir) + '?ref=main', { headers: { 'Accept': 'application/vnd.github+json' } })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          if (!Array.isArray(data)) throw new Error('unexpected payload');
          var items = data
            .filter(function (i) { return i && (i.type === 'dir' || i.type === 'file'); })
            .map(function (i) { return { name: i.name, path: i.path, size: i.size, type: i.type }; });
          renderList(items, dir);
          setStatus('', items.length + ' 个条目 · 已同步');
          sourceNote.textContent = '数据来源：GitHub Contents API（实时）';
        })
        .catch(function (err) {
          if (dir) {
            showState(svg(ICONS.file) + '<b>读取失败</b>' + esc(err.message) + '<br>请返回上一级重试');
            setStatus('error', '读取失败：' + err.message);
            return;
          }
          renderList(FALLBACK.map(function (i) {
            return { name: i.name, path: i.name, size: i.size, type: i.type };
          }), '');
          setStatus('error', '接口不可用，显示内置清单');
          sourceNote.textContent = '数据来源：内置兜底清单（接口受限时使用）';
        });
    }

    /* ================= 事件 ================= */
    document.getElementById('refreshButton').addEventListener('click', function () { load(currentDir); });

    crumbsEl.addEventListener('click', function (e) {
      var a = e.target.closest('.crumb');
      if (!a) return;
      e.preventDefault();
      if (a.classList.contains('is-current')) return;
      load(a.getAttribute('data-dir') || '');
    });

    window.addEventListener('hashchange', function () {
      var dir = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
      if (dir !== currentDir) load(dir);
    });

    /* 其它站点（如 WorkBuddy 预览域名）根路径亦指向仓库根，故无需区分域名 */
    var initial = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
    load(initial);
  </script>
</body>
</html>
