<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态动效独立展示 V3</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1c2940;
      --muted: #7f8b9f;
      --line: #dfe7f0;
      --page: #f4f8fc;
      --blue: #2382e7;
      --cyan: #18a9c8;
      --warning: #f49a22;
      --warning-deep: #cb7609;
      --danger: #e64a5d;
      --danger-deep: #c52f43;
    }
    html, body { margin: 0; min-width: 1280px; height: 100%; overflow: hidden; }
    body {
      color: var(--ink);
      background:
        linear-gradient(rgba(35,130,231,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35,130,231,.02) 1px, transparent 1px),
        var(--page);
      background-size: 36px 36px;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      height: 72px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 34px; color: #fff;
      background: linear-gradient(110deg, #176fd3 0%, #238be5 52%, #18a9c8 100%);
      box-shadow: 0 5px 22px rgba(34,125,205,.18);
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.4); border-radius: 7px; background: rgba(255,255,255,.13); }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand h1 { margin: 0; font-size: 19px; line-height: 23px; }
    .brand p { margin: 3px 0 0; font-size: 10px; opacity: .76; }
    .controls { display: flex; align-items: center; gap: 9px; }
    .control-button { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border: 1px solid rgba(255,255,255,.36); border-radius: 6px; color: #fff; background: rgba(255,255,255,.11); font-size: 11px; }
    .control-button:hover { background: rgba(255,255,255,.2); }
    .control-button svg { width: 14px; height: 14px; }

    main { height: calc(100vh - 72px); padding: 22px 30px 30px; }
    .page-head { height: 72px; display: flex; align-items: flex-start; justify-content: space-between; }
    .title { display: flex; align-items: center; gap: 10px; }
    .title::before { content: ""; width: 4px; height: 23px; border-radius: 3px; background: linear-gradient(var(--blue), var(--cyan)); }
    .title h2 { margin: 0; font-size: 18px; }
    .page-head p { margin: 5px 0 0 14px; color: #909cb0; font-size: 11px; }
    .status { display: flex; align-items: center; gap: 7px; padding-top: 7px; color: #7f8b9f; font-size: 10px; }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: #18a76e; box-shadow: 0 0 0 4px rgba(24,167,110,.1); }
    .showcase {
      height: calc(100% - 72px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.64);
    }
    .demo { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    .demo + .demo { border-left: 1px solid var(--line); }
    .demo-head { width: 100%; height: 76px; padding: 19px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; }
    .demo-title { display: flex; align-items: center; gap: 10px; }
    .demo-no { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 28px; border-radius: 6px; color: #fff; font-size: 9px; font-weight: 800; }
    .warning-demo .demo-no { background: var(--warning); }
    .danger-demo .demo-no { background: var(--danger); }
    .scan-demo .demo-no { background: linear-gradient(145deg, var(--warning), var(--danger)); }
    .demo-title b { display: block; color: #344259; font-size: 13px; }
    .demo-title span { display: block; margin-top: 3px; color: #9ba6b7; font-size: 9px; }
    .demo-state { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; color: #94a0b2; font-size: 9px; }
    .demo-state::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #1aaa74; }
    .stage { position: relative; flex: 1; width: 100%; display: grid; place-items: center; overflow: hidden; }
    .stage::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1px; height: 64%; background: linear-gradient(transparent, rgba(35,130,231,.08), transparent); }
    .stage::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 1px; background: linear-gradient(90deg, transparent, rgba(35,130,231,.08), transparent); }
    .scale { position: relative; z-index: 2; transform: translateY(-5%); }

    /* 呼吸预警：图标与三层扩散光环 */
    .breathe-effect { width: 220px; height: 220px; display: grid; place-items: center; }
    .breathe-halo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(244,154,34,.13) 0 24%, rgba(244,154,34,.05) 25% 48%, transparent 49%); animation: haloBreathe 2.4s ease-in-out infinite; }
    .breathe-halo::before, .breathe-halo::after { content: ""; position: absolute; inset: 63px; border: 2px solid rgba(244,154,34,.5); border-radius: 50%; animation: breatheRipple 2.4s ease-out infinite; }
    .breathe-halo::after { animation-delay: 1.2s; }
    .breathe-icon { position: relative; z-index: 3; width: 78px; height: 78px; display: grid; place-items: center; border: 1px solid rgba(244,154,34,.23); border-radius: 18px; color: var(--warning); background: #fff9ef; box-shadow: 0 10px 26px rgba(244,154,34,.15); animation: iconBreathe 2.4s ease-in-out infinite; }
    .breathe-icon svg { width: 35px; height: 35px; stroke-width: 1.9; }
    @keyframes haloBreathe { 0%,100% { transform: scale(.92); opacity: .72; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes breatheRipple { 0% { transform: scale(.5); opacity: .85; } 82%,100% { transform: scale(2.3); opacity: 0; } }
    @keyframes iconBreathe { 0%,100% { transform: scale(1); box-shadow: 0 10px 26px rgba(244,154,34,.14); } 50% { transform: scale(1.08); box-shadow: 0 13px 32px rgba(244,154,34,.22); } }

    /* 边框追踪：只有空边框与运动光迹 */
    .border-effect { width: min(420px, 76%); height: 250px; }
    .track-frame { position: absolute; inset: 0; overflow: hidden; border-radius: 10px; isolation: isolate; }
    .track-frame::before { content: ""; position: absolute; z-index: -2; inset: -115%; background: conic-gradient(from 0deg, transparent 0 70%, rgba(230,74,93,.08) 76%, rgba(230,74,93,.52) 82%, var(--danger) 87%, transparent 93%); animation: trackRotate 3.2s linear infinite; }
    .track-frame::after { content: ""; position: absolute; z-index: -1; inset: 2px; border-radius: 8px; background: rgba(255,255,255,.95); }
    .track-base { position: absolute; inset: 0; border: 1px solid rgba(230,74,93,.15); border-radius: 10px; }
    .track-corner { position: absolute; width: 17px; height: 17px; border-color: rgba(230,74,93,.42); }
    .track-corner.tl { left: -1px; top: -1px; border-left: 2px solid rgba(230,74,93,.42); border-top: 2px solid rgba(230,74,93,.42); border-radius: 10px 0 0; }
    .track-corner.tr { right: -1px; top: -1px; border-right: 2px solid rgba(230,74,93,.42); border-top: 2px solid rgba(230,74,93,.42); border-radius: 0 10px 0 0; }
    .track-corner.bl { left: -1px; bottom: -1px; border-left: 2px solid rgba(230,74,93,.42); border-bottom: 2px solid rgba(230,74,93,.42); border-radius: 0 0 0 10px; }
    .track-corner.br { right: -1px; bottom: -1px; border-right: 2px solid rgba(230,74,93,.42); border-bottom: 2px solid rgba(230,74,93,.42); border-radius: 0 0 10px; }
    @keyframes trackRotate { to { transform: rotate(360deg); } }

    /* 强提醒：仅保留图标间歇抖动 */
    .urgent-effect { width: 250px; height: 220px; display: grid; place-items: center; }
    .urgent-icon { position: relative; z-index: 3; width: 86px; height: 86px; display: grid; place-items: center; border-radius: 20px; color: #fff; background: linear-gradient(145deg, #ed5a6c, #d9384c); box-shadow: 0 13px 30px rgba(230,74,93,.25); animation: urgentShake 2.6s ease-in-out infinite; }
    .urgent-icon svg { width: 39px; height: 39px; stroke-width: 1.9; }
    @keyframes urgentShake { 0%,72%,100% { transform: rotate(0); } 77% { transform: rotate(-5deg); } 82% { transform: rotate(5deg); } 87% { transform: rotate(-3deg); } 92% { transform: rotate(3deg); } 96% { transform: rotate(0); } }

    /* 卡片逐光：柔和光带与静止文字 */
    .scan-effect { width: 100%; min-height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transform: translateY(-2%); }
    .alert-card {
      --alert-color: #ff8e38;
      --alert-rgb: 255, 142, 56;
      position: relative; width: 192px; flex: 0 0 auto; isolation: isolate; overflow: hidden;
      padding: 8px 8px 8px 16px; border-left: 4px solid var(--alert-color); border-radius: 4px;
      background: #fff; box-shadow: 0 2px 8px rgba(22,33,58,.14);
    }
    .alert-card--late { --alert-color: #f54848; --alert-rgb: 245, 72, 72; }
    .alert-card::before {
      content: ""; position: absolute; z-index: 4; top: -28%; bottom: -28%; left: -118px; width: 96px;
      pointer-events: none; transform: translateX(0) skewX(-12deg);
      background: linear-gradient(100deg,
        transparent 0%, rgba(var(--alert-rgb),.015) 16%, rgba(var(--alert-rgb),.045) 30%,
        rgba(var(--alert-rgb),.10) 41%, rgba(var(--alert-rgb),.20) 47%, rgba(255,255,255,.38) 50%,
        rgba(var(--alert-rgb),.17) 53%, rgba(var(--alert-rgb),.07) 62%, rgba(var(--alert-rgb),.02) 76%,
        transparent 90%, transparent 100%);
      filter: blur(4px); opacity: 0;
      animation: refinedScan 4s cubic-bezier(.4,0,.2,1) infinite;
      will-change: transform, opacity;
    }
    .alert-card--late::before { animation-delay: .55s; }
    .alert-card::after {
      content: ""; position: absolute; z-index: 1; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(var(--alert-rgb),.08);
    }
    .card-content { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 8px; }
    .card-title { min-height: 39px; margin: 0; display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid #e5ebf3; color: #16213a; font-size: 14px; font-weight: 600; line-height: 20px; }
    .card-details { display: flex; flex-direction: column; gap: 8px; }
    .detail-row, .status-row { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; }
    .detail-label { color: #58657c; }
    .detail-value, .status-text { color: #16213a; }
    .status-row { height: 33px; border-top: 1px solid #e5ebf3; }
    .status-dot { position: relative; width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--alert-color); box-shadow: 0 0 0 0 rgba(var(--alert-rgb),.42); animation: dotBreathe 1.8s ease-out infinite; }
    .alert-card--late .status-dot { animation-delay: .55s; }
    .status-dot::after { content: ""; position: absolute; inset: -3px; border: 1px solid rgba(var(--alert-rgb),.45); border-radius: 50%; animation: dotRing 1.8s ease-out infinite; }
    .alert-card--late .status-dot::after { animation-delay: .55s; }
    @keyframes refinedScan {
      0%,14% { transform: translateX(0) skewX(-12deg); opacity: 0; }
      26%,62% { opacity: .68; }
      76%,100% { transform: translateX(360px) skewX(-12deg); opacity: 0; }
    }
    @keyframes dotBreathe { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--alert-rgb),.42); } 65%,100% { transform: scale(1.18); box-shadow: 0 0 0 5px rgba(var(--alert-rgb),0); } }
    @keyframes dotRing { 0% { transform: scale(.65); opacity: 0; } 25% { opacity: .75; } 80%,100% { transform: scale(1.55); opacity: 0; } }

    body.paused .stage *, body.paused .stage *::before, body.paused .stage *::after { animation-play-state: paused !important; }
    body.paused .demo-state::before { background: #9aa5b7; }
    body.paused .demo-state { color: #9aa5b7; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"><i data-lucide="waves"></i></div><div><h1>状态动效独立展示</h1><p>STATUS MOTION SHOWCASE</p></div></div>
    <div class="controls"><button class="control-button" id="motionControl"><i data-lucide="pause"></i><span>暂停动效</span></button><button class="control-button" id="replayControl"><i data-lucide="rotate-ccw"></i><span>重新播放</span></button></div>
  </header>
  <main>
    <div class="page-head"><div><div class="title"><h2>预警与滞后状态动效</h2></div><p>图标、边框与卡片动效集中展示</p></div><div class="status"><i></i><span id="motionStatus">动效运行中</span></div></div>
    <section class="showcase">
      <article class="demo warning-demo">
        <div class="demo-head"><div class="demo-title"><span class="demo-no">01</span><div><b>呼吸预警</b><span>WARNING · BREATH</span></div></div><span class="demo-state">运行中</span></div>
        <div class="stage"><div class="scale breathe-effect"><span class="breathe-halo"></span><span class="breathe-icon"><i data-lucide="bell-ring"></i></span></div></div>
      </article>
      <article class="demo danger-demo">
        <div class="demo-head"><div class="demo-title"><span class="demo-no">02</span><div><b>边框追踪</b><span>DELAYED · BORDER TRACK</span></div></div><span class="demo-state">运行中</span></div>
        <div class="stage"><div class="scale border-effect"><div class="track-frame"><span class="track-base"></span><i class="track-corner tl"></i><i class="track-corner tr"></i><i class="track-corner bl"></i><i class="track-corner br"></i></div></div></div>
      </article>
      <article class="demo danger-demo">
        <div class="demo-head"><div class="demo-title"><span class="demo-no">03</span><div><b>强提醒</b><span>DELAYED · URGENT</span></div></div><span class="demo-state">运行中</span></div>
        <div class="stage"><div class="scale urgent-effect"><span class="urgent-icon"><i data-lucide="siren"></i></span></div></div>
      </article>
      <article class="demo scan-demo">
        <div class="demo-head"><div class="demo-title"><span class="demo-no">04</span><div><b>卡片逐光</b><span>WARNING · LIGHT SCAN</span></div></div><span class="demo-state">运行中</span></div>
        <div class="stage">
          <div class="scale scan-effect">
            <article class="alert-card alert-card--warning">
              <div class="card-content">
                <h2 class="card-title">启动环境质量现状调查</h2>
                <div class="card-details">
                  <p class="detail-row"><span class="detail-label">立项时间</span><span class="detail-value">2026-06-06</span></p>
                  <p class="detail-row"><span class="detail-label">计划时间</span><span class="detail-value">2026-10-10</span></p>
                </div>
                <div class="status-row"><span class="status-dot" aria-hidden="true"></span><span class="status-text">预警</span></div>
              </div>
            </article>
            <article class="alert-card alert-card--late">
              <div class="card-content">
                <h2 class="card-title">启动渔业资源现状调查</h2>
                <div class="card-details">
                  <p class="detail-row"><span class="detail-label">立项时间</span><span class="detail-value">2026-06-06</span></p>
                  <p class="detail-row"><span class="detail-label">计划时间</span><span class="detail-value">2026-10-10</span></p>
                </div>
                <div class="status-row"><span class="status-dot" aria-hidden="true"></span><span class="status-text">滞后</span></div>
              </div>
            </article>
          </div>
        </div>
      </article>
    </section>
  </main>
  <script>
    if (window.lucide) lucide.createIcons();
    const motionControl = document.getElementById('motionControl');
    const replayControl = document.getElementById('replayControl');
    const motionStatus = document.getElementById('motionStatus');
    function setPaused(paused) {
      document.body.classList.toggle('paused', paused);
      motionControl.innerHTML = `<i data-lucide="${paused ? 'play' : 'pause'}"></i><span>${paused ? '播放动效' : '暂停动效'}</span>`;
      motionStatus.textContent = paused ? '动效已暂停' : '动效运行中';
      document.querySelectorAll('.demo-state').forEach(item => item.textContent = paused ? '已暂停' : '运行中');
      if (window.lucide) lucide.createIcons();
    }
    motionControl.addEventListener('click', () => setPaused(!document.body.classList.contains('paused')));
    replayControl.addEventListener('click', () => {
      const showcase = document.querySelector('.showcase');
      showcase.style.display = 'none';
      void showcase.offsetWidth;
      showcase.style.display = 'grid';
      setPaused(false);
    });
  </script>
</body>
</html>
