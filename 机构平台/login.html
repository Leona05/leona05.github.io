<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f7fa;
    padding: 24px;
    color: #1f2329;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1px solid #e5e8ee;
    border-radius: 12px;
    padding: 40px 36px 32px;
    box-shadow: 0 4px 24px rgba(31, 35, 41, 0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
  }

  .brand-text p {
    font-size: 12px;
    color: #8a9099;
    margin-top: 2px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #4e5969;
    margin-bottom: 6px;
  }

  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    font-size: 14px;
    color: #1f2329;
    background: #fff;
    border: 1px solid #d8dde5;
    border-radius: 8px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .field input::placeholder { color: #b4b9c2; }

  .field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  .field.invalid input { border-color: #e5484d; }
  .field.invalid input:focus {
    border-color: #e5484d;
    box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.12);
  }

  .pwd-wrap { position: relative; }

  .pwd-wrap input { padding-right: 44px; }

  .pwd-toggle {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #8a9099;
    font-size: 15px;
    line-height: 1;
    border-radius: 8px;
  }

  .pwd-toggle:hover { color: #4e5969; }

  .error-msg {
    display: none;
    font-size: 12px;
    color: #e5484d;
    margin-top: 6px;
  }

  .field.invalid .error-msg { display: block; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 24px;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #4e5969;
    cursor: pointer;
    user-select: none;
  }

  .remember input { width: 14px; height: 14px; accent-color: #2563eb; cursor: pointer; }

  .forgot { color: #2563eb; text-decoration: none; }
  .forgot:hover { text-decoration: underline; }

  .btn-submit {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }

  .btn-submit:hover:not(:disabled) { background: #1d4ed8; }
  .btn-submit:disabled { background: #9db6f0; cursor: not-allowed; }

  .tip {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: #8a9099;
  }

  .toast {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }

  .toast.ok { display: block; background: #e8f5ec; color: #1f7a3f; }
  .toast.err { display: block; background: #fdecec; color: #b4272b; }

  @media (max-width: 420px) {
    .login-card { padding: 32px 22px 26px; }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-logo">L</div>
    <div class="brand-text">
      <h1>欢迎回来</h1>
      <p>请登录以继续使用</p>
    </div>
  </div>

  <form id="loginForm" novalidate>
    <div class="field" id="fieldUser">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" placeholder="请输入账号或邮箱" autocomplete="username">
      <div class="error-msg">请输入账号</div>
    </div>

    <div class="field" id="fieldPwd">
      <label for="password">密码</label>
      <div class="pwd-wrap">
        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
        <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示密码">👁</button>
      </div>
      <div class="error-msg">密码至少 6 位</div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" id="remember"> 记住我
      </label>
      <a href="#" class="forgot">忘记密码？</a>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">登 录</button>
    <div class="toast" id="toast"></div>
  </form>

  <div class="tip">还没有账号？请联系管理员开通</div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const userField = document.getElementById('fieldUser');
  const pwdField = document.getElementById('fieldPwd');
  const userInput = document.getElementById('username');
  const pwdInput = document.getElementById('password');
  const pwdToggle = document.getElementById('pwdToggle');
  const submitBtn = document.getElementById('submitBtn');
  const toast = document.getElementById('toast');
  const remember = document.getElementById('remember');

  // 显示 / 隐藏密码
  pwdToggle.addEventListener('click', () => {
    const show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    pwdToggle.textContent = show ? '🙈' : '👁';
    pwdToggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  });

  // 输入时清除错误提示
  userInput.addEventListener('input', () => userField.classList.remove('invalid'));
  pwdInput.addEventListener('input', () => pwdField.classList.remove('invalid'));

  function showToast(type, text) {
    toast.className = 'toast ' + type;
    toast.textContent = text;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    toast.className = 'toast';
    toast.textContent = '';

    let valid = true;

    if (!userInput.value.trim()) {
      userField.classList.add('invalid');
      valid = false;
    }
    if (pwdInput.value.length < 6) {
      pwdField.classList.add('invalid');
      valid = false;
    }
    if (!valid) return;

    // 模拟提交（真实项目请替换为接口请求）
    submitBtn.disabled = true;
    submitBtn.textContent = '登录中…';

    setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '登 录';
      showToast('ok', '登录成功，正在跳转…');
      // window.location.href = '/home';
    }, 900);
  });

  // 记忆账号（仅本地演示）
  const saved = localStorage.getItem('saved_user');
  if (saved) { userInput.value = saved; remember.checked = true; }
  form.addEventListener('submit', () => {
    if (remember.checked) localStorage.setItem('saved_user', userInput.value.trim());
    else localStorage.removeItem('saved_user');
  });
</script>

</body>
</html>
